server:
  port: 8080

spring:
  application:
    name: url-shortener-service
  datasource:
    url: jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  base-url: http://localhost:8080
  rate-limit:
    capacity: 20
    refill-per-minute: 20
