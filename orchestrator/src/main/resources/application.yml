server:
  port: 8081

spring:
  application:
    name: orchestrator
  datasource:
    url: jdbc:h2:mem:orchestrator;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

orchestrator:
  workflow-definitions-path: classpath:workflows
