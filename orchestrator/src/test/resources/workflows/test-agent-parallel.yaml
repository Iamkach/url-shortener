id: test-agent-parallel
name: Agent-executor parallel fixture (human gate -> agent design/impl -> parallel agent test/docs -> human gate)
nodes:
  - id: reqs
    stage: REQUIREMENTS
    dependsOn: []
    requiresApproval: true
    maxRetries: 0
    exitGate: "requireArtifact:specPath"

  - id: design
    stage: DESIGN
    dependsOn: [reqs]
    maxRetries: 1
    executor: agent
    entryGate: "requireContext:reqs.specPath"
    exitGate: "requireArtifact:designPath"

  - id: impl
    stage: IMPLEMENTATION
    dependsOn: [design]
    maxRetries: 2
    compensation: true
    executor: agent
    entryGate: "requireContext:design.designPath"
    exitGate: "requireArtifact:commit"

  - id: test
    stage: TESTING
    dependsOn: [impl]
    maxRetries: 0
    executor: agent
    entryGate: "requireContext:impl.commit"
    exitGate: "requireArtifact:testReport"

  - id: docs
    stage: DOCUMENTATION
    dependsOn: [impl]
    maxRetries: 0
    executor: agent
    entryGate: "requireContext:impl.commit"
    exitGate: "requireArtifact:docsPath"

  - id: release
    stage: RELEASE_READINESS
    dependsOn: [test, docs]
    requiresApproval: true
    maxRetries: 0
    entryGate: "requireContext:test.testReport"
